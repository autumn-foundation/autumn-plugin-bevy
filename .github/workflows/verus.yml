name: Verus proofs

# Runs every Verus spec in verification/. The specs are not in the Cargo
# build, because Verus uses an extended Rust dialect.
#
# This is not a required check: a new Verus release can break a proof with no
# change here. The Rust test `lifecycle_matches_spec_table` is the required
# gate for the same rules. The weekly run shows when a release breaks a proof.

on:
  pull_request:
    paths:
      - "verification/**"
      - "scripts/verify-verus.sh"
      - ".github/workflows/verus.yml"
  push:
    branches: [main]
    paths:
      - "verification/**"
      - "scripts/verify-verus.sh"
      - ".github/workflows/verus.yml"
  schedule:
    # Mondays 05:23 UTC.
    - cron: "23 5 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verus:
    name: Verus proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Verus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/verus"
          mkdir -p "$dir"
          # The newest release with a Linux asset.
          tag="$(gh api 'repos/verus-lang/verus/releases?per_page=30' \
            --jq '[.[] | select(any(.assets[]; .name | endswith("x86-linux.zip")))][0].tag_name')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::no Verus release has an x86-linux.zip asset"
            exit 1
          fi
          echo "Verus release: $tag"
          gh release download "$tag" --repo verus-lang/verus --pattern '*x86-linux.zip' --dir "$dir"
          unzip -q "$dir"/*.zip -d "$dir"
          verus_bin="$(find "$dir" -type f -name verus -perm -u+x | head -n 1)"
          if [ -z "$verus_bin" ]; then
            echo "::error::the Verus release asset has no verus binary"
            exit 1
          fi
          # Verus needs one exact Rust toolchain. It names it in a hint.
          out="$("$verus_bin" --version 2>&1)" || true
          version="$(printf '%s\n' "$out" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-x86_64-unknown-linux-gnu' | head -n 1 | cut -d- -f1)" || true
          if [ -n "$version" ]; then
            echo "Verus needs Rust $version"
            rustup toolchain install "$version" --profile minimal
          fi
          "$verus_bin" --version
          echo "VERUS_BIN=$verus_bin" >> "$GITHUB_ENV"

      - name: Verify specs
        run: ./scripts/verify-verus.sh
